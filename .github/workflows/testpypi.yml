name: TestPyPI rehearsal

on:
  push:
    tags:
      - "v*rc*"

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and release tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Verify release-candidate identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"rehearsal tag {actual!r} does not match package version {expected!r}")
          if re.fullmatch(r"v\d+\.\d+\.\d+rc\d+", actual) is None:
              raise SystemExit(f"TestPyPI tag must be a release candidate: {actual!r}")
          print(f"release-candidate identity verified: {actual}")
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Build exact wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Record distribution checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - name: Store validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Store distribution checksums
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kb-artifacts/
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist

      - name: Publish with TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  verify:
    name: Verify as an external consumer
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create clean consumer environment
        run: python -m venv "${RUNNER_TEMP}/kb-artifacts-testpypi"

      - name: Install the exact release candidate from TestPyPI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..10}; do
            if "${RUNNER_TEMP}/kb-artifacts-testpypi/bin/python" -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "kb-artifacts==${version}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 10 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Smoke-test installed public API
        working-directory: ${{ runner.temp }}
        run: >-
          "${RUNNER_TEMP}/kb-artifacts-testpypi/bin/python" -I -c
          "from kb_artifacts import SelectionRequest, inspect_source, select"

      - name: Smoke-test installed CLI
        working-directory: ${{ runner.temp }}
        run: >-
          "${RUNNER_TEMP}/kb-artifacts-testpypi/bin/kb-artifact" --help

      - name: Run the tutorial outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          cat > evidence.jsonl <<'EOF'
          {"title":"Deploy app","text":"Build and deploy the service","tags":["runbook","ops"]}
          {"title":"Buy groceries","text":"Milk and bread","tags":["personal"]}
          EOF
          "${RUNNER_TEMP}/kb-artifacts-testpypi/bin/kb-artifact" select \
            --chunk-glob evidence.jsonl \
            --tag runbook \
            --output selected
          test "$(wc -l < selected/selected.jsonl)" -eq 1
          test -f selected/selected.csv
          test -f selected/artifact.md
          test -f selected/manifest.json
