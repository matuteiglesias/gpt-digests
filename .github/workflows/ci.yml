name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-distribution:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Run repository tests
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Create clean wheel-test environment
        run: python -m venv "${RUNNER_TEMP}/kb-artifacts-wheel"

      - name: Install the built wheel
        run: >-
          "${RUNNER_TEMP}/kb-artifacts-wheel/bin/python" -m pip install dist/*.whl

      - name: Smoke-test installed public API
        working-directory: ${{ runner.temp }}
        run: >-
          "${RUNNER_TEMP}/kb-artifacts-wheel/bin/python" -I -c
          "from kb_artifacts import EvidenceRecord, SelectionDecision,
          SelectionRequest, SourceReference, inspect_source, select"

      - name: Smoke-test installed CLI
        working-directory: ${{ runner.temp }}
        run: >-
          "${RUNNER_TEMP}/kb-artifacts-wheel/bin/kb-artifact" --help
